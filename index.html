
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZFSI-HRIS | Human Resource System</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #10243b;
      color: #243449;
    }

    .login {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 20px 60px #0003;
    }

    .logo {
      width: 48px;
      height: 48px;
      background: #2879c7;
      color: white;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 25px;
      font-weight: bold;
    }

    h1 { margin-bottom: 5px; }
    p { color: #8290a2; }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dce3eb;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: 0;
      border-radius: 8px;
      background: #2879c7;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    #message {
      font-size: 13px;
      margin-top: 15px;
      color: #c03939;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <main class="login">
    <div class="logo">Z</div>

    <h1>ZFSI-HRIS</h1>
    <p>Human Resource Information System</p>

    <form id="loginForm">
      <label>Email</label>
      <input
        type="email"
        id="email"
        required
        placeholder="nama@perusahaan.com"
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        required
        placeholder="Masukkan password"
      >

      <button id="loginButton" type="submit">
        Login
      </button>
    </form>

    <div id="message" role="alert"></div>

    <div class="footer">
      ZFSI-HRIS © 2026
    </div>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    // GANTI DENGAN KONFIGURASI DARI FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyAxzK62xtPRAw-ruQLo-xcZUBbdaYpOQPE",
      authDomain: "zfsi-hris.firebaseapp.com",
      projectId: "zfsi-hris",
      storageBucket: "zfsi-hris.firebasestorage.app",
      messagingSenderId: "642441161494",
      appId: "1:642441161494:web:23ecd4832f89eac5893e37"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    onAuthStateChanged(auth, user => {
      if (user) {
        location.replace("dashboard.html");
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "Memproses...";
      message.textContent = "";

      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value,
          document.getElementById("password").value
        );

        message.style.color = "green";
        message.textContent = "Login berhasil.";

      } catch (error) {
        message.style.color = "#c03939";
        message.textContent =
          "Login gagal. Periksa email dan password.";

        console.error(error);
      }

      button.disabled = false;
      button.textContent = "Login";
    });
  </script>
</body>
</html>
